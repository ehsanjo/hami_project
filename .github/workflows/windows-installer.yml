name: Windows installer

# Run it by hand from the Actions tab ("Run workflow"), or by pushing a tag like v1.0.0
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC) with Qt Charts
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Set up the MSVC compiler environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build, test, deploy and package
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set QT_DIR=%QT_ROOT_DIR%
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          call packaging\windows\build-windows.bat

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: PriceTracker-windows-installer
          path: dist/windows/*-setup.exe
          if-no-files-found: error
