name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  QT_VERSION: "6.8.3"       # use the same minor version you use locally
  NDK_VERSION: "26.1.10909125"   # the NDK Qt 6.8 expects

permissions:
  contents: write      # put this at the top level, next to "on:" and "env:"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Qt for the build machine (needed when cross-compiling)
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          dir: ${{ github.workspace }}/qt
          cache: true

      # Qt for Android
      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtcharts
          dir: ${{ github.workspace }}/qt
          cache: true

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

      - name: Build APK
        run: cmake --build build --target apk

      - name: Show manifest icon line
        run: grep -n "icon" build/android-build/AndroidManifest.xml || true

      - name: Find APK
        run: find build -name "*.apk" -print

      - name: Sign APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          # Prefer the unsigned release APK, otherwise take any APK that was built
          APK=$(find build -name "*-release-unsigned.apk" | head -n 1)
          if [ -z "$APK" ]; then APK=$(find build -name "*.apk" | head -n 1); fi
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "Using: $APK"

          keytool -genkeypair -keystore my.keystore -alias key -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=PriceTracker"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks my.keystore --ks-pass pass:android \
            --out PriceTracker-signed.apk aligned.apk
          "$BT/apksigner" verify --verbose PriceTracker-signed.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PriceTracker build ${{ github.run_number }}
          files: PriceTracker-signed.apk
