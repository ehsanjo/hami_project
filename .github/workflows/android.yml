name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  QT_VERSION: "6.8.3"       # use the same minor version you use locally
  NDK_VERSION: "26.1.10909125"   # the NDK Qt 6.8 expects

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Qt for the build machine (needed when cross-compiling)
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          dir: ${{ github.workspace }}/qt
          cache: true

      # Qt for Android
      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtcharts
          dir: ${{ github.workspace }}/qt
          cache: true

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="${{ github.workspace }}/qt/${QT_VERSION}/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

      - name: Build APK
        run: cmake --build build --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceTracker-apk
          path: build/android-build/build/outputs/apk/**/*.apk
